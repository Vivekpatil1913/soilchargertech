<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/jpeg" href="/logo/soillogo.jpg" />
    <link rel="apple-touch-icon" href="/logo/soillogo.jpg" />
    <meta name="theme-color" content="#0c3d27" />

    <!-- Two working families, plus one for Devanagari.

         Fraunces carries every heading. It is a warm, slightly bookish serif,
         and pairing a serif display against a sans body is the single biggest
         reason the page reads as an established agricultural institution
         rather than as a product launch. Only the two weights actually used
         are requested, with `opsz` so large headings pick up the display cut.

         Inter handles body copy, labels and numbers — its tall x-height keeps
         15px readable on a phone in the field, and its tabular figures keep
         dosages and pack sizes from jittering in a column.

         Tiro Devanagari Marathi serves the Marathi and Hindi translations.
         It is a serif, so translated headings keep the same voice as the
         English ones instead of falling back to a system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Marathi&display=swap"
    />

    <title>Soil Charger Technology — Soil is healthier, farmer wealthier</title>
    <meta
      name="description"
      content="Soil Charger Technology builds soil-first agricultural solutions — restoring organic carbon, strengthening fertility and supporting natural crop development for Indian farmers since 2015."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
